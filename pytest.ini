# pytest configuration — AUTHORITATIVE.
#
# pytest loads exactly one config file by priority:
#   pytest.ini > pyproject.toml > tox.ini > setup.cfg
# Because this file exists, pytest reports
#   "configfile: pytest.ini (WARNING: ignoring pytest config
#    in pyproject.toml!)"
# and the [tool.pytest.ini_options] table in pyproject.toml is
# NEVER read. Every pytest setting therefore has to live here,
# not in pyproject.toml. (pyproject keeps a mirrored copy as
# documentation / for the no-pytest.ini case, but this file is
# the one CI and local runs actually use.)
#
# pythonpath: the plugin package lives in
# py_modules/unifideck/ (a non-src, non-installed layout
# dictated by Decky Loader) and is never `pip install`-ed.
# Without this, `import unifideck` fails during collection
# (the CI "ModuleNotFoundError: No module named 'unifideck'"
# on every security test). pytest >= 7 prepends these dirs to
# sys.path before collection; minversion guarantees support.
#
# strict warnings + markers: every warning becomes an error so
# a Deprecation/Runtime warning from a dependency bump or a
# sloppy test fails the suite instead of scrolling past.
# ResourceWarning is the single documented allow-list entry
# (unclosed-file noise from application/dependency config
# readers, out of scope for the suite, never seen in normal
# runs). A second, narrowly-scoped ignore covers the
# "Unknown config option: asyncio_mode" PytestConfigWarning:
# jobs with a minimal tooling install (complexity.yml's
# lint-scope step) run pytest WITHOUT pytest-asyncio, so
# asyncio_mode is unknown there and ``filterwarnings = error``
# would otherwise turn that benign config warning into a fatal
# INTERNALERROR. It is a job-environment artefact, not a code
# defect, so it is the one config-warning exception — every
# other warning still fails the suite. --strict-markers
# rejects typo'd markers. --strict-config is deliberately NOT
# used (same asyncio_mode incompatibility, fatal under
# strict-config regardless of filterwarnings). -ra surfaces
# skips/xfails; the tests.yml JUnit gate turns any skip into a
# hard failure.
[pytest]
minversion = 8.0
testpaths = tests
pythonpath = py_modules
asyncio_mode = auto
addopts =
    --strict-markers
    -ra
    -p no:cacheprovider
filterwarnings =
    error
    ignore::ResourceWarning
    ignore:Unknown config option:pytest.PytestConfigWarning
