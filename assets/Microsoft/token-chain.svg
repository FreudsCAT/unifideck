<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280">
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}.h{font-size:13px;font-weight:500}.s{font-size:11px;fill:#555}.arr{stroke-width:1.2;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round"/></marker></defs>
  <rect x="40" y="30" width="180" height="70" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
  <text class="h" x="130" y="54" text-anchor="middle" fill="#3C3489">Microsoft OAuth</text>
  <text class="s" x="130" y="72" text-anchor="middle">code → POST /token</text><text class="s" x="130" y="88" text-anchor="middle">→ access_token</text>
  <line x1="220" y1="65" x2="270" y2="65" class="arr" stroke="#534AB7"/>
  <rect x="272" y="30" width="180" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
  <text class="h" x="362" y="54" text-anchor="middle" fill="#0C447C">XBL User Token</text>
  <text class="s" x="362" y="72" text-anchor="middle">user.auth.xboxlive.com</text><text class="s" x="362" y="88" text-anchor="middle">→ xbl_token + user_hash</text>
  <line x1="452" y1="65" x2="502" y2="65" class="arr" stroke="#185FA5"/>
  <rect x="504" y="30" width="180" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
  <text class="h" x="594" y="54" text-anchor="middle" fill="#085041">XSTS Token</text>
  <text class="s" x="594" y="72" text-anchor="middle">xsts.auth.xboxlive.com</text><text class="s" x="594" y="88" text-anchor="middle">→ xsts_token + xuid</text>
  <rect x="40" y="130" width="640" height="56" rx="8" fill="#F8F8F6" stroke="#B4B2A9" stroke-width="0.6"/>
  <text class="h" x="360" y="152" text-anchor="middle" fill="#444">Combinaisons XBL (3 tentatives)</text>
  <text class="s" x="160" y="174" text-anchor="middle">1. v2 + t= (JWT)</text>
  <text class="s" x="360" y="174" text-anchor="middle">2. v1 + d= (MSA)</text>
  <text class="s" x="560" y="174" text-anchor="middle">3. v1 + t= (fallback)</text>
  <rect x="40" y="210" width="640" height="50" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/>
  <text class="h" x="360" y="232" text-anchor="middle" fill="#633806">Automatic refresh</text>
  <text class="s" x="360" y="250" text-anchor="middle">Token > 3300s → POST refresh_token → Nouveaux tokens | Échec → auto-logout</text>
</svg>
