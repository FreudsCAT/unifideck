<svg xmlns="http://www.w3.org/2000/svg" width="720" height="660" viewBox="0 0 720 660">
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}.h{font-size:13px;font-weight:500}.s{font-size:11px;fill:#555}.n{font-size:10.5px;fill:#0C447C}.arr{stroke-width:1;fill:none;marker-end:url(#a)}.life{stroke-dasharray:5 4;stroke-width:0.5;stroke:#BBB}</style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round"/></marker></defs>
  <rect x="40" y="16" width="80" height="32" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><text class="h" x="80" y="36" text-anchor="middle" fill="#3C3489">User</text>
  <rect x="170" y="16" width="80" height="32" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/><text class="h" x="210" y="36" text-anchor="middle" fill="#085041">Frontend</text>
  <rect x="300" y="16" width="80" height="32" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/><text class="h" x="340" y="36" text-anchor="middle" fill="#0C447C">Backend</text>
  <rect x="435" y="16" width="80" height="32" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/><text class="h" x="475" y="36" text-anchor="middle" fill="#633806">Chromium</text>
  <rect x="575" y="16" width="80" height="32" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.6"/><text class="h" x="615" y="36" text-anchor="middle" fill="#712B13">Microsoft</text>
  <line x1="80" y1="48" x2="80" y2="650" class="life"/><line x1="210" y1="48" x2="210" y2="650" class="life"/><line x1="340" y1="48" x2="340" y2="650" class="life"/><line x1="475" y1="48" x2="475" y2="650" class="life"/><line x1="615" y1="48" x2="615" y2="650" class="life"/>
  <text class="s" x="145" y="78">Connect</text><line x1="80" y1="82" x2="208" y2="82" class="arr" stroke="#534AB7"/>
  <text class="s" x="268" y="102">start_auth()</text><line x1="210" y1="106" x2="338" y2="106" class="arr" stroke="#0F6E56"/>
  <text class="s" x="395" y="126">launch_auth(url)</text><line x1="340" y1="130" x2="473" y2="130" class="arr" stroke="#185FA5"/>
  <text class="s" x="530" y="152">GET /authorize</text><line x1="475" y1="156" x2="613" y2="156" class="arr" stroke="#854F0B"/>
  <rect x="330" y="168" width="170" height="22" rx="4" fill="#E6F1FB" stroke="none"/><text class="n" x="415" y="183" text-anchor="middle">inject_virtual_keyboard()</text><line x1="340" y1="194" x2="473" y2="194" class="arr" stroke="#185FA5"/>
  <text class="s" x="120" y="224">Enter email + password</text><line x1="80" y1="228" x2="473" y2="228" class="arr" stroke="#534AB7"/>
  <text class="s" x="530" y="254">POST /token</text><line x1="475" y1="258" x2="613" y2="258" class="arr" stroke="#854F0B"/>
  <text class="s" x="530" y="280">redirect?code=ABC</text><line x1="613" y1="284" x2="477" y2="284" class="arr" stroke="#993C1D"/>
  <rect x="330" y="296" width="170" height="22" rx="4" fill="#E6F1FB" stroke="none"/><text class="n" x="415" y="311" text-anchor="middle">CDP intercept code=ABC</text><line x1="473" y1="322" x2="342" y2="322" class="arr" stroke="#185FA5"/>
  <rect x="320" y="342" width="320" height="130" rx="8" fill="#F8F8F6" stroke="#B4B2A9" stroke-width="0.6"/>
  <text class="h" x="480" y="362" text-anchor="middle" fill="#444">Token exchange</text>
  <text class="s" x="370" y="384">POST /token (code → access_token)</text><line x1="340" y1="388" x2="613" y2="388" class="arr" stroke="#185FA5"/>
  <text class="s" x="370" y="414">XBL: t=access_token → xbl_token</text><line x1="340" y1="418" x2="613" y2="418" class="arr" stroke="#185FA5"/>
  <text class="s" x="370" y="444">XSTS: xbl_token → xsts_token</text><line x1="340" y1="448" x2="613" y2="448" class="arr" stroke="#185FA5"/>
  <text class="s" x="400" y="466" fill="#27500A">Tokens sauvegardés</text>
  <text class="s" x="395" y="498">kill() Chromium</text><line x1="340" y1="502" x2="473" y2="502" class="arr" stroke="#185FA5"/>
  <text class="s" x="268" y="530">Connected ✓</text><line x1="338" y1="534" x2="212" y2="534" class="arr" stroke="#0F6E56"/>
  <rect x="160" y="555" width="380" height="44" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.6"/>
  <text class="h" x="350" y="574" text-anchor="middle" fill="#27500A">Sync xCloud catalog (~500 games)</text>
  <text class="s" x="350" y="590" text-anchor="middle">→ Steam shortcuts with artwork</text>
  <line x1="340" y1="540" x2="340" y2="553" class="arr" stroke="#3B6D11"/>
  <rect x="60" y="620" width="600" height="30" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
  <text class="h" x="360" y="640" text-anchor="middle" fill="#085041">Jeux disponibles — bouton "Jouer sur le Cloud"</text>
</svg>
