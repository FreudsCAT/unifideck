<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380">
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}.h{font-size:13px;font-weight:500}.s{font-size:11px;fill:#555}.code{font-size:10.5px;font-family:monospace;fill:#444}.arr{stroke-width:1.2;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round"/></marker></defs>
  <rect x="40" y="24" width="140" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
  <text class="h" x="110" y="44" text-anchor="middle" fill="#3C3489">Play on Cloud</text><text class="s" x="110" y="62" text-anchor="middle">PlayButtonOverride</text>
