  <line x1="475" y1="76" x2="475" y2="100" class="arr" stroke="#185FA5"/>
  <rect x="80" y="102" width="560" height="52" rx="8" fill="#F8F8F6" stroke="#B4B2A9" stroke-width="0.6"/>
  <text class="h" x="360" y="120" text-anchor="middle" fill="#444">games.map</text>
  <text class="code" x="360" y="144" text-anchor="middle">microsoft:9NPDN9R45JX4|xcloud|https://www.xbox.com/play/launch/...</text>
  <line x1="360" y1="154" x2="360" y2="178" class="arr" stroke="#5F5E5A"/>
  <rect x="80" y="180" width="560" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/>
