<svg xmlns="http://www.w3.org/2000/svg" width="720" height="680" viewBox="0 0 720 680">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    .h { font-size: 13px; font-weight: 500; }
    .s { font-size: 10.5px; fill: #555; }
    .uc { font-size: 11px; fill: #0C447C; }
    .rel { font-size: 9.5px; font-style: italic; fill: #888; }
    .actor-name { font-size: 11px; font-weight: 500; fill: #444; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
    <marker id="ahopen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="context-stroke" stroke-width="1.2" stroke-linecap="round"/>
    </marker>
  </defs>

  <!-- System boundary -->
  <rect x="120" y="20" width="440" height="640" rx="16" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="8 4"/>
  <text class="h" x="340" y="46" text-anchor="middle" fill="#444">Unifideck — Microsoft Integration</text>

  <!-- ═══ LEFT ACTOR: User ═══ -->
  <!-- Stick figure -->
  <circle cx="50" cy="285" r="12" fill="none" stroke="#3C3489" stroke-width="1.5"/>
  <line x1="50" y1="297" x2="50" y2="330" stroke="#3C3489" stroke-width="1.5"/>
  <line x1="30" y1="310" x2="70" y2="310" stroke="#3C3489" stroke-width="1.5"/>
  <line x1="50" y1="330" x2="34" y2="350" stroke="#3C3489" stroke-width="1.5"/>
  <line x1="50" y1="330" x2="66" y2="350" stroke="#3C3489" stroke-width="1.5"/>
  <text class="actor-name" x="50" y="366" text-anchor="middle" fill="#3C3489">User</text>

  <!-- ═══ RIGHT ACTORS ═══ -->
  <!-- Microsoft APIs -->
  <circle cx="670" cy="130" r="12" fill="none" stroke="#993C1D" stroke-width="1.5"/>
  <line x1="670" y1="142" x2="670" y2="168" stroke="#993C1D" stroke-width="1.5"/>
  <line x1="652" y1="153" x2="688" y2="153" stroke="#993C1D" stroke-width="1.5"/>
  <line x1="670" y1="168" x2="656" y2="184" stroke="#993C1D" stroke-width="1.5"/>
  <line x1="670" y1="168" x2="684" y2="184" stroke="#993C1D" stroke-width="1.5"/>
  <text class="actor-name" x="670" y="200" text-anchor="middle" fill="#993C1D">Microsoft</text>

  <!-- Steam -->
  <circle cx="670" cy="370" r="12" fill="none" stroke="#0F6E56" stroke-width="1.5"/>
  <line x1="670" y1="382" x2="670" y2="408" stroke="#0F6E56" stroke-width="1.5"/>
  <line x1="652" y1="393" x2="688" y2="393" stroke="#0F6E56" stroke-width="1.5"/>
  <line x1="670" y1="408" x2="656" y2="424" stroke="#0F6E56" stroke-width="1.5"/>
  <line x1="670" y1="408" x2="684" y2="424" stroke="#0F6E56" stroke-width="1.5"/>
  <text class="actor-name" x="670" y="440" text-anchor="middle" fill="#0F6E56">Steam</text>

  <!-- Chromium -->
  <circle cx="670" cy="550" r="12" fill="none" stroke="#854F0B" stroke-width="1.5"/>
  <line x1="670" y1="562" x2="670" y2="588" stroke="#854F0B" stroke-width="1.5"/>
  <line x1="652" y1="573" x2="688" y2="573" stroke="#854F0B" stroke-width="1.5"/>
  <line x1="670" y1="588" x2="656" y2="604" stroke="#854F0B" stroke-width="1.5"/>
  <line x1="670" y1="588" x2="684" y2="604" stroke="#854F0B" stroke-width="1.5"/>
  <text class="actor-name" x="670" y="620" text-anchor="middle" fill="#854F0B">Chromium</text>

  <!-- ═══ USE CASES (ellipses) ═══ -->

  <!-- UC1: Sign in -->
  <ellipse cx="300" cy="90" rx="100" ry="24" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
  <text class="uc" x="300" y="94" text-anchor="middle">Sign in</text>

  <!-- UC2: Sign out -->
  <ellipse cx="300" cy="160" rx="100" ry="24" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
  <text class="uc" x="300" y="164" text-anchor="middle">Sign out</text>

  <!-- UC3: Parcourir les jeux -->
  <ellipse cx="300" cy="240" rx="110" ry="24" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
  <text class="uc" x="300" y="244" text-anchor="middle">Browse xCloud games</text>

  <!-- UC4: Lancer un jeu -->
  <ellipse cx="300" cy="320" rx="100" ry="24" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
  <text class="uc" x="300" y="324" text-anchor="middle">Launch an xCloud game</text>

  <!-- UC5: Close game -->
  <ellipse cx="300" cy="390" rx="100" ry="24" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
  <text class="uc" x="300" y="394" text-anchor="middle">Close game</text>

  <!-- UC6: Synchroniser -->
  <ellipse cx="300" cy="460" rx="110" ry="24" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
  <text class="uc" x="300" y="464" text-anchor="middle">Sync library</text>

  <!-- UC7: Install Chromium -->
  <ellipse cx="300" cy="540" rx="100" ry="24" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/>
  <text class="uc" x="300" y="544" text-anchor="middle" fill="#633806">Install Chromium</text>

  <!-- UC-include: Enter credentials -->
  <ellipse cx="480" cy="72" rx="70" ry="20" fill="#F8F8F6" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="s" x="480" y="76" text-anchor="middle">Enter credentials</text>

  <!-- UC-include: Virtual keyboard -->
  <ellipse cx="480" cy="126" rx="70" ry="20" fill="#F8F8F6" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="s" x="480" y="130" text-anchor="middle">Virtual keyboard</text>

  <!-- UC-include: Automatic SSO -->
  <ellipse cx="480" cy="320" rx="70" ry="20" fill="#F8F8F6" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="s" x="480" y="324" text-anchor="middle">Automatic SSO</text>

  <!-- UC-extend: Refresh tokens -->
  <ellipse cx="480" cy="460" rx="70" ry="20" fill="#F8F8F6" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="s" x="480" y="464" text-anchor="middle">Refresh tokens</text>

  <!-- UC-extend: Auto-logout -->
  <ellipse cx="200" cy="610" rx="75" ry="20" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text class="s" x="200" y="614" text-anchor="middle" fill="#791F1F">Auto-logout</text>

  <!-- UC-extend: Clear cookies -->
  <ellipse cx="420" cy="160" rx="70" ry="20" fill="#F8F8F6" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="s" x="420" y="164" text-anchor="middle">Clear cookies</text>

  <!-- ═══ ASSOCIATIONS: User → Use Cases ═══ -->
  <line x1="70" y1="290" x2="200" y2="90" stroke="#3C3489" stroke-width="0.7"/>
  <line x1="70" y1="300" x2="200" y2="160" stroke="#3C3489" stroke-width="0.7"/>
  <line x1="70" y1="305" x2="190" y2="240" stroke="#3C3489" stroke-width="0.7"/>
  <line x1="70" y1="315" x2="200" y2="320" stroke="#3C3489" stroke-width="0.7"/>
  <line x1="70" y1="325" x2="200" y2="390" stroke="#3C3489" stroke-width="0.7"/>
  <line x1="70" y1="335" x2="190" y2="460" stroke="#3C3489" stroke-width="0.7"/>
  <line x1="70" y1="345" x2="200" y2="540" stroke="#3C3489" stroke-width="0.7"/>

  <!-- ═══ ASSOCIATIONS: Use Cases → Right Actors ═══ -->
  <!-- Sign in → Microsoft -->
  <line x1="400" y1="90" x2="652" y2="138" stroke="#993C1D" stroke-width="0.5"/>
  <!-- Sign out → Microsoft -->
  <line x1="400" y1="155" x2="652" y2="145" stroke="#993C1D" stroke-width="0.5"/>
  <!-- Parcourir → Steam -->
  <line x1="410" y1="240" x2="652" y2="378" stroke="#0F6E56" stroke-width="0.5"/>
  <!-- Lancer → Steam -->
  <line x1="400" y1="320" x2="652" y2="385" stroke="#0F6E56" stroke-width="0.5"/>
  <!-- Lancer → Chromium -->
  <line x1="400" y1="335" x2="652" y2="555" stroke="#854F0B" stroke-width="0.5"/>
  <!-- Fermer → Steam -->
  <line x1="400" y1="390" x2="652" y2="392" stroke="#0F6E56" stroke-width="0.5"/>
  <!-- Sync → Microsoft -->
  <line x1="410" y1="448" x2="652" y2="150" stroke="#993C1D" stroke-width="0.5"/>
  <!-- Install → Chromium -->
  <line x1="400" y1="545" x2="652" y2="558" stroke="#854F0B" stroke-width="0.5"/>

  <!-- ═══ <<include>> RELATIONS (dashed, with label) ═══ -->
  <!-- Sign in --include--> Enter credentials -->
  <line x1="385" y1="78" x2="415" y2="74" stroke="#888" stroke-width="0.6" stroke-dasharray="4 3" marker-end="url(#ahopen)"/>
  <text class="rel" x="395" y="64">≪include≫</text>

  <!-- Enter credentials --extend--> Virtual keyboard -->
  <line x1="480" y1="92" x2="480" y2="104" stroke="#888" stroke-width="0.6" stroke-dasharray="4 3" marker-end="url(#ahopen)"/>
  <text class="rel" x="500" y="102">≪extend≫</text>

  <!-- Sign out --include--> Clear cookies -->
  <line x1="370" y1="155" x2="365" y2="158" stroke="#888" stroke-width="0.6" stroke-dasharray="4 3" marker-end="url(#ahopen)"/>
  <text class="rel" x="370" y="148">≪include≫</text>

  <!-- Lancer --include--> Automatic SSO -->
  <line x1="400" y1="318" x2="410" y2="320" stroke="#888" stroke-width="0.6" stroke-dasharray="4 3" marker-end="url(#ahopen)"/>
  <text class="rel" x="410" y="306">≪include≫</text>

  <!-- Synchroniser --extend--> Refresh tokens -->
  <line x1="410" y1="458" x2="410" y2="460" stroke="#888" stroke-width="0.6" stroke-dasharray="4 3" marker-end="url(#ahopen)"/>
  <text class="rel" x="430" y="448">≪extend≫</text>

  <!-- Sign in --extend--> Install Chromium -->
  <path d="M260 112 C240 160, 220 400, 230 520" fill="none" stroke="#854F0B" stroke-width="0.6" stroke-dasharray="4 3" marker-end="url(#ahopen)"/>
  <text class="rel" x="200" y="340" fill="#854F0B">≪extend≫</text>
  <text class="s" x="195" y="352" fill="#854F0B">[if missing]</text>

  <!-- Lancer --extend--> Auto-logout -->
  <path d="M240 340 C220 400, 200 520, 200 588" fill="none" stroke="#A32D2D" stroke-width="0.6" stroke-dasharray="4 3" marker-end="url(#ahopen)"/>
  <text class="rel" x="178" y="500" fill="#A32D2D">≪extend≫</text>
  <text class="s" x="155" y="512" fill="#A32D2D">[session lost]</text>

  <!-- ═══ LEGEND ═══ -->
  <rect x="130" y="648" width="420" height="4" rx="2" fill="none" stroke="none"/>
  <ellipse cx="160" cy="660" rx="20" ry="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.4"/>
  <text class="s" x="188" y="664">Primary action</text>
  <ellipse cx="295" cy="660" rx="20" ry="8" fill="#F8F8F6" stroke="#B4B2A9" stroke-width="0.4"/>
  <text class="s" x="323" y="664">Include / extend</text>
  <ellipse cx="425" cy="660" rx="20" ry="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.4"/>
  <text class="s" x="453" y="664">Error / auto</text>
</svg>
