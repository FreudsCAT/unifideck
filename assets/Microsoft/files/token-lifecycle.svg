<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    .h { font-size: 13px; font-weight: 500; }
    .s { font-size: 11px; fill: #555; }
    .code { font-size: 10px; font-family: "SF Mono", monospace; fill: #444; }
    .arr { stroke-width: 1.2; fill: none; marker-end: url(#ah); }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>

  <!-- Timeline bar -->
  <rect x="40" y="55" width="640" height="6" rx="3" fill="#F1EFE8" stroke="none"/>

  <!-- Phase 1: Creation -->
  <rect x="40" y="55" width="120" height="6" rx="3" fill="#0F6E56"/>
  <rect x="40" y="18" width="120" height="32" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
  <text class="h" x="100" y="32" text-anchor="middle" fill="#085041">Creation</text>
  <text class="s" x="100" y="46" text-anchor="middle">complete_auth()</text>

  <!-- Phase 2: Valid -->
  <rect x="160" y="55" width="200" height="6" rx="3" fill="#185FA5"/>
  <rect x="160" y="18" width="200" height="32" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
  <text class="h" x="260" y="32" text-anchor="middle" fill="#0C447C">Valid (~55 min)</text>
  <text class="s" x="260" y="46" text-anchor="middle">Used for XBL/XSTS/catalog</text>

  <!-- Phase 3: Refresh zone -->
  <rect x="360" y="55" width="120" height="6" rx="3" fill="#854F0B"/>
  <rect x="360" y="18" width="120" height="32" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/>
  <text class="h" x="420" y="32" text-anchor="middle" fill="#633806">Refresh</text>
  <text class="s" x="420" y="46" text-anchor="middle">age > 3300s</text>

  <!-- Phase 4: Expired -->
  <rect x="480" y="55" width="200" height="6" rx="3" fill="#A32D2D"/>
  <rect x="480" y="18" width="200" height="32" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.6"/>
  <text class="h" x="580" y="32" text-anchor="middle" fill="#791F1F">Expired (~60 min)</text>
  <text class="s" x="580" y="46" text-anchor="middle">Refresh or re-auth</text>

  <!-- Time markers -->
  <text class="code" x="40" y="78">0s</text>
  <text class="code" x="350" y="78">3300s</text>
  <text class="code" x="470" y="78">3600s</text>
  <text class="code" x="656" y="78">...</text>

  <!-- Refresh flow -->
  <rect x="40" y="105" width="640" height="160" rx="10" fill="#F8F8F6" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="h" x="360" y="126" text-anchor="middle" fill="#444">_ensure_fresh_ms_token()</text>

  <rect x="70" y="142" width="150" height="40" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="s" x="145" y="158" text-anchor="middle" fill="#0C447C">age &lt; 3300s ?</text>
  <text class="s" x="145" y="172" text-anchor="middle" fill="#085041">→ True (frais)</text>

  <line x1="220" y1="162" x2="270" y2="162" class="arr" stroke="#5F5E5A"/>

  <rect x="272" y="142" width="180" height="40" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text class="s" x="362" y="158" text-anchor="middle" fill="#633806">POST /token</text>
  <text class="s" x="362" y="172" text-anchor="middle" fill="#633806">grant_type=refresh_token</text>

  <line x1="452" y1="152" x2="510" y2="152" class="arr" stroke="#0F6E56"/>
  <text class="s" x="476" y="144" fill="#0F6E56">OK</text>

  <rect x="512" y="138" width="150" height="32" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="s" x="587" y="158" text-anchor="middle" fill="#085041">New tokens</text>

  <line x1="452" y1="172" x2="510" y2="208" class="arr" stroke="#A32D2D"/>
  <text class="s" x="468" y="196" fill="#A32D2D">Failure</text>

  <rect x="512" y="194" width="150" height="40" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text class="h" x="587" y="210" text-anchor="middle" fill="#791F1F">auto-logout()</text>
  <text class="s" x="587" y="226" text-anchor="middle" fill="#791F1F">Re-auth required</text>
</svg>
