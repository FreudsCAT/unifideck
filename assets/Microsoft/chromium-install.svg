<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    .h { font-size: 13px; font-weight: 500; }
    .s { font-size: 11px; fill: #555; }
    .arr { stroke-width: 1.2; fill: none; marker-end: url(#ah); }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect x="40" y="30" width="150" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
  <text class="h" x="115" y="50" text-anchor="middle" fill="#3C3489">start_auth()</text>
  <text class="s" x="115" y="66" text-anchor="middle">Backend</text>

  <line x1="190" y1="54" x2="236" y2="54" class="arr" stroke="#534AB7"/>

  <polygon points="306,30 376,54 306,78 236,54" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/>
  <text class="s" x="306" y="52" text-anchor="middle" fill="#633806">is_installed?</text>
  <text class="s" x="306" y="66" text-anchor="middle" fill="#633806">find_cmd()</text>

  <line x1="376" y1="54" x2="420" y2="54" class="arr" stroke="#0F6E56"/>
  <text class="s" x="398" y="46" fill="#0F6E56">Oui</text>

  <rect x="422" y="30" width="140" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
  <text class="h" x="492" y="50" text-anchor="middle" fill="#085041">launch_auth()</text>
  <text class="s" x="492" y="66" text-anchor="middle">Chromium fullscreen</text>

  <line x1="306" y1="78" x2="306" y2="108" class="arr" stroke="#993C1D"/>
  <text class="s" x="320" y="98" fill="#993C1D">Non</text>

  <rect x="206" y="110" width="200" height="48" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.6"/>
  <text class="h" x="306" y="130" text-anchor="middle" fill="#712B13">needs_chromium: true</text>
  <text class="s" x="306" y="146" text-anchor="middle">Returns to frontend</text>

  <line x1="306" y1="158" x2="306" y2="188" class="arr" stroke="#993C1D"/>

  <rect x="180" y="190" width="252" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
  <text class="h" x="306" y="210" text-anchor="middle" fill="#0C447C">ChromiumInstallModal</text>
  <text class="s" x="306" y="226" text-anchor="middle">Offers to install Chromium</text>

  <line x1="306" y1="238" x2="306" y2="260" class="arr" stroke="#185FA5"/>
  <text class="s" x="320" y="254" fill="#185FA5">Accept</text>

  <rect x="140" y="262" width="332" height="28" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text class="s" x="306" y="280" text-anchor="middle" fill="#27500A">flatpak install --user -y flathub org.chromium.Chromium</text>

  <line x1="432" y1="238" x2="432" y2="214" class="arr" stroke="#A32D2D"/>
  <text class="s" x="480" y="230" fill="#A32D2D">Decline</text>

  <rect x="500" y="190" width="170" height="48" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text class="s" x="585" y="210" text-anchor="middle" fill="#791F1F">Auth impossible</text>
  <text class="s" x="585" y="226" text-anchor="middle" fill="#791F1F">without browser</text>

  <path d="M472 276 L590 276 L590 136 L590 54 L564 54" fill="none" stroke="#27500A" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <text class="s" x="600" y="170" fill="#27500A" transform="rotate(90 600 170)">Installed → relaunch auth</text>
</svg>
